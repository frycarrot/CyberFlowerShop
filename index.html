<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3EBDD">
  <title>赛博花店 · Cyber Florist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="top">
    <div class="brand">
      <span class="brand-en">Florist</span>
      <span class="brand-sub"><i class="rule"></i><span class="brand-cn">赛博花店</span><i class="rule r"></i></span>
    </div>
    <div id="toLine" class="to-line hidden"><span class="to-en">To</span> <span id="toName"></span></div>
  </header>

  <div id="hint" class="hint hidden">拖动转一转 · 点花看花语 · 点贺卡读寄语</div>

  <div id="bubble" class="bubble hidden" role="dialog" aria-live="polite">
    <div class="bubble-head">
      <span id="bubbleDot" class="dot"></span>
      <span id="bubbleName" class="bubble-name"></span>
      <span id="bubbleMeaning" class="bubble-meaning"></span>
    </div>
    <div id="bubbleQuote" class="bubble-quote"></div>
  </div>

  <nav class="toolbar">
    <button id="btnCard" class="tag" type="button">
      <span class="tag-text"><span class="en">Letter</span><span class="cn">读贺卡</span></span>
    </button>
    <button id="btnShot" class="tag" type="button">
      <span class="tag-text"><span class="en">Keepsake</span><span class="cn">保存图片</span></span>
    </button>
    <button id="btnPaste" class="tag" type="button">
      <span class="tag-text"><span class="en">Order</span><span class="cn">贴花束码</span></span>
    </button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <!-- 贺卡 -->
  <div id="letter" class="overlay hidden">
    <div id="letterCard" class="letter">
      <svg class="letter-bg" viewBox="0 0 100 92" preserveAspectRatio="none" aria-hidden="true">
        <path class="shape" d="M50 88 C38 78 4 60 4 30 C4 14 15 5 28 5 C38 5 46 11 50 19 C54 11 62 5 72 5 C85 5 96 14 96 30 C96 60 62 78 50 88 Z"/>

3.799 9.849 L33.016 9.630 L32.218 9.441 L31.405 9.285 L30.577 9.162 L29.733 9.073 L28.874 9.018 L28.126 9.000 L27.168 9.014 L26.346 9.057 L25.534 9.129 L24.732 9.228 L23.475 9.444 L22.251 9.730 L21.062 10.083 L19.911 10.504 L18.799 10.989 L17.599 11.612 L16.580 12.234 L15.607 12.918 L14.681 13.665 L13.805 14.474 L12.981 15.345 L12.210 16.280 L11.493 17.279 L10.835 18.342 L10.236 19.473 L9.763 20.518 L9.456 21.297 L9.175 22.103 L8.922 22.937 L8.698 23.799 L8.502 24.690 L8.337 25.609 L8.203 26.557 L8.120 27.337 L8.046 28.338 L8.012 29.159 L8.000 29.996 L8.021 31.206 L8.057 32.001 L8.143 33.182 L8.269 34.348 L8.431 35.500 L8.560 36.260 L8.784 37.390 L8.952 38.135 L9.233 39.244 L9.777 41.064 L10.146 42.141 L10.547 43.206 L11.283 44.957 L11.763 45.992 L12.273 47.017 L12.810 48.031 L13.374 49.035 L13.964 50.027 L14.578 51.009 L15.656 52.621 L17.031 54.516 L18.488 56.367 L20.018 58.174 L21.614 59.936 L23.547 61.936 L25.255 63.600 L27.295 65.484 L29.073 67.050 L31.171 68.819 L33.279 70.527 L35.684 72.403 L37.473 73.758 L39.530 75.283 L47.180 80.814 Z"/>
      </svg>
      <!-- 方形卡：带锯齿边的邮票 + 盖在上面的邮戳；圆形 / 心形卡：小花枝 -->
      <div class="post" aria-hidden="true">
        <div class="stamp-wrap">
          <div class="stamp">
            <div class="stamp-art">
              <svg class="stamp-flower" viewBox="0 0 40 40">
                <path class="fill" d="M20 12 c-3-5-9-3-8 2 c-5 0-6 6-1 8 c-3 4 2 9 6 5 c1 5 8 5 8-1 c4 3 9-2 5-6 c5-2 3-8-2-7 c0-5-6-6-8-1z"/>
                <circle cx="20" cy="20" r="3" class="dot"/>
                <path d="M20 27 C20 32 18 35 15 38 M19 32 C16 31 14 32 12 34"/>
              </svg>
              <span class="stamp-name">Florist</span>
              <span class="stamp-val">520</span>
            </div>
          </div>
        </div>
        <svg class="postmark" viewBox="0 0 130 64">
          <circle cx="40" cy="32" r="25"/>
          <circle cx="40" cy="32" r="20.5" stroke-width=".8"/>
          <text x="40" y="29" text-anchor="middle" class="pm-top">FLORIST</text>
          <text id="pmDate" x="40" y="40" text-anchor="middle" class="pm-date">2026.11.08</text>
          <path d="M70 18 q6-4 12 0 t12 0 t12 0 t12 0 M70 28 q6-4 12 0 t12 0 t12 0 t12 0 M70 38 q6-4 12 0 t12 0 t12 0 t12 0 M70 48 q6-4 12 0 t12 0 t12 0 t12 0"/>
        </svg>
      </div>
      <svg class="sprig" viewBox="0 0 80 24" aria-hidden="true">
        <path d="M6 16 C24 10 56 10 74 16"/>
        <path d="M22 13 c-3-5-1-9 3-10 c1 4-0 8-3 10z M40 11.5 c-2-5 0-9 0-10 c2 2 3 6 0 10z M58 13 c3-5 1-9-3-10 c-1 4 0 8 3 10z M30 12 c2 4 6 5 9 4 c-2-3-5-5-9-4z M50 12 c-2 4-6 5-9 4 c2-3 5-5 9-4z" class="fill"/>
      </svg>
      <div class="letter-body">
        <div id="letterTo" class="letter-to"></div>
        <div id="letterMsg" class="letter-msg"></div>
        <div id="letterFrom" class="letter-from"></div>
      </div>
    </div>
    <p class="overlay-tip">点空白处把贺卡插回去</p>
  </div>

  <!-- 截图 -->
  <div id="shot" class="overlay hidden">
    <div class="shot-box">
      <img id="shotImg" alt="花束图片">
      <p class="overlay-tip">手机上长按图片也可以保存</p>
      <div class="row">
        <a id="shotDownload" class="tag" download="cyber-flower.png"><span class="tag-text"><span class="en">Download</span><span class="cn">下载图片</span></span></a>
        <button id="shotClose" class="tag" type="button"><span class="tag-text"><span class="en">Close</span><span class="cn">关闭</span></span></button>
      </div>
    </div>
  </div>

  <!-- 贴花束码 -->
  <div id="paste" class="overlay hidden">
    <div class="sheet">
      <h2>把家机给你的花束码贴进来</h2>
      <textarea id="pasteText" rows="5" placeholder="[花束:玫瑰1×3,勿忘我1×2|包装纸2|丝带1|卡片:心形2|To:小兔|From:阿机|寄语:今天也很想你]"></textarea>
      <div class="row">
        <button id="pasteGo" class="tag" type="button"><span class="tag-text"><span class="en">Bloom</span><span class="cn">生成花束</span></span></button>
        <button id="pasteClose" class="tag" type="button"><span class="tag-text"><span class="en">Cancel</span><span class="cn">取消</span></span></button>
      </div>
      <div class="row small">
        <button id="copyLink" class="link" type="button">复制当前花束链接</button>
        <button id="copyMenu" class="link" type="button">复制花店菜单（贴给家机）</button>
        <a class="link" href="samples.html">示例花束</a>
      </div>
    </div>
  </div>

  <div id="fatal" class="fatal hidden"></div>

  <script src="vendor/three.min.js"></script>
  <script src="js/order.js?v=20261108-links1"></script>
  <script src="js/models.js"></script>
  <script src="js/app.js?v=20261108-links1"></script>
</body>
</html>
